<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow-pink" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix" values="1 0 0 0 0  0 0.28 0 0 0  0 0 0.6 0 0  0 0 0 0.55 0" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-coral" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix" values="0.97 0 0 0 0  0 0.44 0 0 0  0 0 0.44 0 0  0 0 0 0.55 0" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-gray" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix" values="0.61 0 0 0 0  0 0.64 0 0 0  0 0 0.69 0 0  0 0 0 0.45 0" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix" values="0.02 0 0 0 0  0 0.71 0 0 0  0 0 0.83 0 0  0 0 0 0.55 0" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix" values="0.23 0 0 0 0  0 0.51 0 0 0  0 0 0.96 0 0  0 0 0 0.55 0" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Left column: pink, coral, gray -->
  <circle cx="198" cy="128" r="33" fill="#ec4899" filter="url(#glow-pink)"/>
  <circle cx="196" cy="262" r="33" fill="#f87171" filter="url(#glow-coral)"/>
  <circle cx="200" cy="390" r="33" fill="#9ca3af" filter="url(#glow-gray)"/>
  <!-- Right column: cyan, blue -->
  <circle cx="312" cy="190" r="33" fill="#06b6d4" filter="url(#glow-cyan)"/>
  <circle cx="316" cy="326" r="33" fill="#3b82f6" filter="url(#glow-blue)"/>
</svg>

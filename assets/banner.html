<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; }
  body { width: 2100px; height: 900px; background: #0d0d0d; overflow: hidden;
         font-family: "Inter", "Segoe UI", Arial, sans-serif; position: relative; }
  /* sutil viñeta para profundidad, sin gradientes chillones */
  .vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 90% at 32% 50%, rgba(255,255,255,0.025), transparent 70%); }
  .text { position: absolute; left: 170px; top: 50%; transform: translateY(-50%); }
  .title { font-size: 118px; font-weight: 650; letter-spacing: -0.03em; color: #e4e4e7; }
  .sub { margin-top: 26px; font-size: 40px; font-weight: 400; color: #71717a; letter-spacing: 0.01em; }
  .sub b { color: #a1a1aa; font-weight: 500; }
  .mark { position: absolute; right: 150px; top: 50%; transform: translateY(-50%); width: 620px; height: 620px; }
  /* links finos entre los dots, estilo grafo */
  .links line { stroke: #2c2c31; stroke-width: 3; }
</style></head>
<body>
  <div class="vignette"></div>
  <div class="text">
    <div class="title">Linear Theme</div>
    <div class="sub">Premium dark theme for ComfyUI &nbsp;·&nbsp; by <b>Agunode</b></div>
  </div>
  <svg class="mark" viewBox="0 0 512 512" fill="none">
    <defs>
      <filter id="glow-pink" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
        <feColorMatrix in="blur1" type="matrix" values="1 0 0 0 0  0 0.28 0 0 0  0 0 0.6 0 0  0 0 0 0.55 0" result="glow1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
        <feMerge><feMergeNode in="glow1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-coral" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
        <feColorMatrix in="blur1" type="matrix" values="0.97 0 0 0 0  0 0.44 0 0 0  0 0 0.44 0 0  0 0 0 0.55 0" result="glow1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
        <feMerge><feMergeNode in="glow1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-gray" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
        <feColorMatrix in="blur1" type="matrix" values="0.61 0 0 0 0  0 0.64 0 0 0  0 0 0.69 0 0  0 0 0 0.45 0" result="glow1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
        <feMerge><feMergeNode in="glow1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-cyan" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
        <feColorMatrix in="blur1" type="matrix" values="0.02 0 0 0 0  0 0.71 0 0 0  0 0 0.83 0 0  0 0 0 0.55 0" result="glow1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
        <feMerge><feMergeNode in="glow1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-blue" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
        <feColorMatrix in="blur1" type="matrix" values="0.23 0 0 0 0  0 0.51 0 0 0  0 0 0.96 0 0  0 0 0 0.55 0" result="glow1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
        <feMerge><feMergeNode in="glow1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g class="links">
      <line x1="198" y1="128" x2="312" y2="190"/>
      <line x1="196" y1="262" x2="312" y2="190"/>
      <line x1="196" y1="262" x2="316" y2="326"/>
      <line x1="200" y1="390" x2="316" y2="326"/>
    </g>
    <circle cx="198" cy="128" r="33" fill="#ec4899" filter="url(#glow-pink)"/>
    <circle cx="196" cy="262" r="33" fill="#f87171" filter="url(#glow-coral)"/>
    <circle cx="200" cy="390" r="33" fill="#9ca3af" filter="url(#glow-gray)"/>
    <circle cx="312" cy="190" r="33" fill="#06b6d4" filter="url(#glow-cyan)"/>
    <circle cx="316" cy="326" r="33" fill="#3b82f6" filter="url(#glow-blue)"/>
  </svg>
</body></html>
